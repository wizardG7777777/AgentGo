<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentGo 控制台</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --border:#262b36; --fg:#d6dae2; --dim:#8a92a3;
          --accent:#4f9cf9; --ok:#3fb96f; --warn:#d9a13b; --err:#e05d5d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:13px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif; }
  header { display:flex; align-items:center; gap:16px; padding:10px 16px;
           background:var(--panel); border-bottom:1px solid var(--border);
           position:sticky; top:0; z-index:10; }
  header h1 { font-size:15px; margin:0; }
  header .meta { color:var(--dim); }
  header .meta b { color:var(--fg); font-weight:600; }
  #conn { margin-left:auto; padding:2px 10px; border-radius:10px; font-size:12px; }
  #conn.on  { background:rgba(63,185,111,.15); color:var(--ok); }
  #conn.off { background:rgba(224,93,93,.15); color:var(--err); }
  #viewTabs { display:flex; gap:6px; padding:10px 16px 0; overflow-x:auto; }
  .view-tab { background:transparent; color:var(--dim); border:1px solid transparent; border-radius:6px;
              padding:5px 12px; cursor:pointer; white-space:nowrap; }
  .view-tab:hover { color:var(--fg); background:rgba(79,156,249,.06); }
  .view-tab.active { color:var(--accent); background:rgba(79,156,249,.12); border-color:rgba(79,156,249,.45); }
  main { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:12px 16px; }
  section { background:var(--panel); border:1px solid var(--border); border-radius:8px;
            padding:10px 12px; min-width:0; }
  section.view-panel { display:none; }
  section.view-panel.active { display:block; }
  section h2 { font-size:13px; margin:0 0 8px; color:var(--dim); font-weight:600; }
  #agents { grid-column:1; } #tasks { grid-column:2; }
  #result { grid-column:1 / -1; border-color:rgba(63,185,111,.65); }
  #stream { grid-column:1; } #interactions { grid-column:2; }
	#agentWorkbench, #activity { grid-column:1 / -1; }
	#resultBody { max-height:45vh; overflow:auto; white-space:pre-wrap; word-break:break-word;
	              border-left:3px solid var(--ok); padding:8px 10px; background:rgba(63,185,111,.05); }
	#resultBody pre { margin:6px 0 0; color:var(--fg); font:13px/1.55 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
	                  white-space:pre-wrap; word-break:break-word; }
	#resultBody .result-meta { color:var(--ok); font-weight:600; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:8px; }
  .card { border:1px solid var(--border); border-radius:6px; padding:8px 10px; background:#14171d; }
  .card .cid { font-weight:600; }
  .badge { display:inline-block; padding:0 8px; border-radius:9px; font-size:11px; margin-left:6px; }
  .st-idle { background:rgba(138,146,163,.18); color:var(--dim); }
  .st-processing { background:rgba(79,156,249,.18); color:var(--accent); }
  .st-waiting_interaction { background:rgba(217,161,59,.18); color:var(--warn); }
  .st-terminating { background:rgba(224,93,93,.18); color:var(--err); }
  .card .kv { color:var(--dim); margin-top:4px; }
  .card .kv b { color:var(--fg); font-weight:500; }
  .taskgroup { margin-bottom:8px; }
  .taskgroup h3 { font-size:12px; margin:6px 0 4px; color:var(--fg); }
  .taskgroup ul { margin:0; padding-left:18px; color:var(--dim); }
  .taskgroup .tid { color:var(--accent); font-family:Consolas,monospace; }
  #streamBody { height:340px; overflow-y:auto; font-family:Consolas,"Courier New",monospace;
                font-size:12px; white-space:pre-wrap; word-break:break-all; }
  .ev { padding:1px 0; border-bottom:1px dotted #1e222b; }
  .ev .t { color:var(--dim); margin-right:6px; }
  .ev .k { color:var(--accent); margin-right:6px; }
  .ev.log .k { color:var(--dim); } .ev.out .k { color:var(--ok); }
  .filters { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:6px; color:var(--dim); }
  .filters label { user-select:none; cursor:pointer; }
  .agent-tabs { display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; margin-bottom:10px;
                border-bottom:1px solid var(--border); }
  .agent-tab { flex:0 0 auto; }
  .agent-tab.active { color:var(--accent); border-color:var(--accent); background:rgba(79,156,249,.12); }
  .workbench-head { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:10px; }
  .workbench-head .cid { font-size:15px; }
  .workbench-grid { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr); gap:10px; }
  .subpanel { min-width:0; border:1px solid var(--border); border-radius:6px; padding:9px 10px; background:#14171d; }
  .subpanel h3 { margin:0 0 7px; font-size:12px; color:var(--dim); }
  .output-item, .activity-item { border-bottom:1px dotted var(--border); padding:6px 0; }
  .output-item:last-child, .activity-item:last-child { border-bottom:0; }
  .output-item pre { margin:4px 0 0; white-space:pre-wrap; word-break:break-word;
                     font:13px/1.55 "Segoe UI","Microsoft YaHei",system-ui,sans-serif; }
  .activity-meta { color:var(--dim); font-size:12px; }
  #agentOutput, #agentActivity, #activityBody { max-height:58vh; overflow:auto; }
  .activity-agents { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:7px; margin-bottom:10px; }
  @media (max-width:900px) {
    main { grid-template-columns:1fr; }
    #agents, #tasks, #result, #stream, #interactions, #agentWorkbench, #activity { grid-column:1; }
    .workbench-grid { grid-template-columns:1fr; }
    header { flex-wrap:wrap; }
  }
  .interaction { border:1px solid var(--warn); border-radius:6px; padding:8px 10px; margin-bottom:6px;
                 background:rgba(217,161,59,.06); }
  .interaction .prompt { color:var(--fg); white-space:pre-wrap; }
  .interaction .ops { margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; }
  .interaction .option-desc { margin-top:3px; color:var(--dim); font-size:12px; }
  .empty { color:var(--dim); font-style:italic; }
  .btn { background:#1f242e; color:var(--fg); border:1px solid var(--border); border-radius:5px;
         padding:3px 10px; font-size:12px; cursor:pointer; }
  .btn:hover { border-color:var(--accent); }
  .btn.primary { background:var(--accent); color:#0b0e13; border-color:var(--accent); font-weight:600; }
  .btn.small { padding:0 8px; font-size:11px; margin-left:6px; }
  #inputBar { display:flex; gap:8px; padding:10px 16px 0; }
  #userInput { flex:1; background:var(--panel); border:1px solid var(--border); border-radius:6px;
               color:var(--fg); padding:6px 10px; font-size:13px; }
  #userInput:focus { outline:none; border-color:var(--accent); }
  #toast { position:fixed; top:52px; right:16px; z-index:99; max-width:420px; padding:8px 12px;
           border-radius:6px; background:rgba(63,185,111,.15); color:var(--ok);
           border:1px solid var(--ok); cursor:pointer; white-space:pre-wrap; word-break:break-all; }
  #toast.err { background:rgba(224,93,93,.15); color:var(--err); border-color:var(--err); }
  #toast.hidden { display:none; }
  /* 斜杠命令补全下拉 */
  #inputBar { position:relative; }
  #suggest { position:absolute; left:16px; right:16px; top:100%; z-index:50;
             background:#14171d; border:1px solid var(--border); border-radius:6px;
             margin-top:4px; max-height:260px; overflow-y:auto; }
  #suggest.hidden { display:none; }
  #suggest .row { padding:5px 10px; cursor:pointer; display:flex; gap:12px; }
  #suggest .row.sel, #suggest .row:hover { background:rgba(79,156,249,.12); }
  .tid { color:var(--accent); font-family:Consolas,monospace; }
  .u { font-family:Consolas,monospace; color:var(--accent); white-space:nowrap; }
  .d { color:var(--dim); }
  /* 模态面板（/help、/status、/session） */
  #modal { position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.5);
           display:flex; align-items:flex-start; justify-content:center; padding-top:10vh; }
  #modal.hidden { display:none; }
  #modalCard { background:var(--panel); border:1px solid var(--border); border-radius:8px;
               width:min(640px,92vw); max-height:70vh; display:flex; flex-direction:column; }
  #modalHead { display:flex; align-items:center; padding:10px 14px; border-bottom:1px solid var(--border); }
  #modalTitle { font-weight:600; }
  #modalClose { margin-left:auto; background:none; border:none; color:var(--dim); font-size:18px; cursor:pointer; }
  #modalBody { padding:12px 14px; overflow-y:auto; }
  .cmdline { display:flex; gap:12px; padding:3px 0; }
  .cmdline .u { min-width:200px; }
  .sessrow { display:flex; gap:10px; align-items:center; padding:5px 0; border-bottom:1px dotted var(--border); }
</style>
</head>
<body>
<header>
  <h1>AgentGo 控制台</h1>
  <button id="modeBtn" class="btn" title="点击切换 topo 轴；/mode 可设置 exec / topo">模式：-</button>
  <span class="meta">会话：<b id="session">-</b></span>
  <button id="newSessBtn" class="btn" title="创建并切换到新会话">新会话</button>
  <button id="helpBtn" class="btn" title="查看全部斜杠命令（同 /help）">命令</button>
  <span id="conn" class="off">未连接</span>
</header>
<div id="inputBar">
  <input id="userInput" type="text" placeholder="输入消息或 / 命令（Tab 补全，/help 查看帮助）" autocomplete="off">
  <button id="sendBtn" class="btn primary">发送</button>
  <div id="suggest" class="hidden"></div>
</div>
<nav id="viewTabs" aria-label="主视图">
  <button class="view-tab active" data-view="overview">总览</button>
  <button class="view-tab" data-view="agents">Agent 工作台</button>
  <button class="view-tab" data-view="activity">实时动向</button>
  <button class="view-tab" data-view="trace">Trace / 日志</button>
</nav>
<div id="toast" class="hidden"></div>
<div id="modal" class="hidden">
  <div id="modalCard">
    <div id="modalHead"><span id="modalTitle"></span><button id="modalClose">×</button></div>
    <div id="modalBody"></div>
  </div>
</div>
<main>
  <section id="agents" class="view-panel active" data-view-panel="overview"><h2>代理</h2><div id="agentCards" class="cards"><div class="empty">加载中…</div></div></section>
  <section id="tasks" class="view-panel active" data-view-panel="overview"><h2>任务看板</h2><div id="taskBoard"><div class="empty">加载中…</div></div></section>
	<section id="result" class="view-panel active" data-view-panel="overview"><h2>最近完成回复</h2><div id="resultBody"><div class="empty">尚无完成结果</div></div></section>
  <section id="interactions" class="view-panel active" data-view-panel="overview"><h2>等待回应</h2><div id="interactionList"><div class="empty">当前没有等待回应</div></div></section>
  <section id="agentWorkbench" class="view-panel" data-view-panel="agents">
    <h2>Agent 工作台</h2>
    <div id="agentTabs" class="agent-tabs"></div>
    <div id="agentSummary"></div>
    <div class="workbench-grid">
      <div class="subpanel"><h3>完整轮次输出</h3><div id="agentOutput"><div class="empty">选择一个 Agent 查看输出</div></div></div>
      <div class="subpanel"><h3>近期工具与 Trace 动向</h3><div id="agentActivity"><div class="empty">选择一个 Agent 查看动向</div></div></div>
    </div>
  </section>
  <section id="activity" class="view-panel" data-view-panel="activity">
    <h2>实时动向</h2>
    <div id="activityBody"><div class="empty">暂无活动</div></div>
  </section>
  <section id="stream" class="view-panel" data-view-panel="trace">
    <h2>Trace / 工具调用 / 系统日志</h2>
    <div class="filters" id="filters"></div>
    <div id="streamBody"></div>
  </section>
</main>
<script>
"use strict";
// ---------- 访问令牌（服务端 ui.web.token 非空时需要） ----------
let token = localStorage.getItem("agentgo.ui.token") || "";
function authHeaders() { return token ? { "Authorization": "Bearer " + token } : {}; }
function withToken(url) { return token ? url + (url.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(token) : url; }
function askToken() {
  const t = prompt("服务器要求访问令牌（ui.web.token），请输入：");
  if (t !== null) { token = t.trim(); localStorage.setItem("agentgo.ui.token", token); }
}

// ---------- 本地状态 ----------
const state = {
  agents: [], tasks: [], interactions: [], result: null,
  turns: [],
  feed: { outputs: [], logs: [], traces: [] },
  activeAgent: "", agentOutputFollow: true, view: "overview",
};
const curModes = { exec: "", topo: "" };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

function setView(view) {
  state.view = view;
  document.querySelectorAll("[data-view-panel]").forEach(panel => {
    panel.classList.toggle("active", panel.dataset.viewPanel === view);
  });
  document.querySelectorAll(".view-tab").forEach(tab => {
    tab.classList.toggle("active", tab.dataset.view === view);
  });
  if (view === "agents") renderAgentWorkbench();
  if (view === "activity") renderActivity();
  if (view === "trace") renderDiagnostics();
}
$("viewTabs").addEventListener("click", e => {
  const tab = e.target.closest("[data-view]");
  if (tab) setView(tab.dataset.view);
});

// ---------- 渲染 ----------
function modeLabel(axis, value) {
  const labels = {
    exec: { normal: "常规", strict: "严格", readonly: "只读", yolo: "放权" },
    topo: { team: "团队", solo: "单代理" },
  };
  return (labels[axis] && labels[axis][value]) || value || "-";
}
function renderModeBtn() {
  $("modeBtn").textContent = `模式：${modeLabel("exec", curModes.exec)} / ${modeLabel("topo", curModes.topo)}`;
}
function renderHeader(snap) {
  if (!snap) return;
  curModes.exec = snap.exec_mode || "";
  curModes.topo = snap.topo_mode || "";
  renderModeBtn();
  $("session").textContent = (snap.session && snap.session.id) ? snap.session.id : "-";
}
function renderAgents() {
  const el = $("agentCards");
  if (!state.agents.length) { el.innerHTML = '<div class="empty">暂无代理</div>'; return; }
  el.innerHTML = state.agents.map(a => `
    <div class="card">
      <div><span class="cid">${esc(a.id)}</span><span class="badge st-${esc(a.state)}">${esc(a.state)}</span></div>
      <div class="kv">类型 <b>${esc(a.type || "-")}</b> · Loop <b>${a.loop || 0}</b> · 阶段 <b>${esc(a.phase || "-")}</b></div>
      <div class="kv">任务 <b>${esc(a.current_task_id || "-")}</b> ${esc(a.current_task_desc || "")}</div>
      <div class="kv">Token <b>${a.prompt_tokens || 0}</b> / <b>${a.completion_tokens || 0}</b>（${a.call_count || 0} 次调用）</div>
      <div class="kv">邮箱待读 <b>${a.mailbox_pending || 0}</b> · 工具 <b>${esc(a.last_tool || "-")}</b> ×${a.tool_call_count || 0}</div>
      <div class="kv">活动 <b>${esc(a.activity_age || "-")}</b>${a.last_error ? ' · <span style="color:var(--err)">' + esc(a.last_error) + "</span>" : ""}</div>
      <div class="kv"><button class="btn small" data-open-agent="${esc(a.id)}">查看实时输出</button><button class="btn small" data-steer="${esc(a.id)}">引导</button></div>
    </div>`).join("");
}
function renderResult() {
	const el = $("resultBody");
	if (!state.result || !state.result.text) {
		el.innerHTML = '<div class="empty">尚无完成结果</div>';
		return;
	}
	const agent = state.result.agent_id ? ` · ${esc(state.result.agent_id)}` : "";
	el.innerHTML = `<div class="result-meta">✓ 任务已完成${agent}</div><pre>${esc(state.result.text)}</pre>`;
}
const STATUS_ORDER = ["pending", "processing", "completed", "failed", "cancelled"];
const STATUS_NAME = { pending: "待处理", processing: "进行中", completed: "已完成", failed: "失败", cancelled: "已取消" };
const TERMINAL_STATUS = { completed: 1, failed: 1, cancelled: 1 };
function renderTasks() {
  const el = $("taskBoard");
  if (!state.tasks.length) { el.innerHTML = '<div class="empty">暂无任务</div>'; return; }
  const groups = {};
  for (const t of state.tasks) (groups[t.status] = groups[t.status] || []).push(t);
  const keys = Object.keys(groups).sort((a, b) => {
    const ia = STATUS_ORDER.indexOf(a), ib = STATUS_ORDER.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });
  el.innerHTML = keys.map(st => `
    <div class="taskgroup">
      <h3>${esc(STATUS_NAME[st] || st)}（${groups[st].length}）</h3>
      <ul>${groups[st].map(t => `<li><span class="tid">${esc(t.id)}</span> ${esc(t.desc || "")}
        ${t.agents && t.agents.length ? " · " + esc(t.agents.join(", ")) : ""}
        ${!TERMINAL_STATUS[t.status] ? `<button class="btn small" data-cancel="${esc(t.id)}">取消</button>` : ""}</li>`).join("")}</ul>
    </div>`).join("");
}
function renderInteractions() {
  const el = $("interactionList");
  if (!state.interactions.length) { el.innerHTML = '<div class="empty">当前没有等待回应</div>'; return; }
  el.innerHTML = state.interactions.map(item => {
    const options = item.options || [];
    const buttons = options.map(option => `
      <button class="btn small" data-interaction="${esc(item.id)}" data-version="${Number(item.version) || 0}"
        data-option="${esc(option.id)}" data-requires-text="${option.requires_text ? "true" : "false"}"
        title="${esc(option.description || option.id)}">${esc(option.label || option.id)}</button>`).join("");
    const textButton = item.allow_free_text && (item.kind === "text" || !options.length)
      ? `<button class="btn small" data-interaction="${esc(item.id)}" data-version="${Number(item.version) || 0}" data-free-text="true">输入回答</button>`
      : "";
    const descriptions = options.filter(option => option.description).map(option =>
      `<div class="option-desc"><span class="tid">${esc(option.id)}</span>：${esc(option.description)}</div>`).join("");
    const subject = item.task_id || item.subject_id || "-";
    return `<div class="interaction">
      <div class="prompt"><b>${esc(item.prompt || "需要你的回应")}</b></div>
      <div class="kv" style="color:var(--dim)">${esc(item.kind || "interaction")} · ${esc(item.purpose || "-")} · 对象 ${esc(subject)}</div>
      ${descriptions}<div class="ops">${buttons}${textButton}</div>
    </div>`;
  }).join("");
}
function knownAgentIDs() {
  const ids = new Set(state.agents.map(a => a.id).filter(Boolean));
  for (const turn of state.turns) if (turn.agent_id) ids.add(turn.agent_id);
  for (const item of state.feed.outputs) if (item.agent_id) ids.add(item.agent_id);
  for (const item of state.feed.traces) if (item.agent_id) ids.add(item.agent_id);
  return Array.from(ids);
}
function ensureActiveAgent() {
  const ids = knownAgentIDs();
  if (!ids.includes(state.activeAgent)) state.activeAgent = ids[0] || "";
  return ids;
}
function traceText(t) {
  const bits = [t.kind || "trace"];
  if (t.tool) bits.push("tool=" + t.tool);
  if (t.task_id) bits.push("task=" + t.task_id);
  if (t.loop) bits.push("loop=" + t.loop);
  if (t.path) bits.push(t.path);
  if (t.message) bits.push(t.message);
  if (t.duration_ms) bits.push(t.duration_ms + "ms");
  return bits.join(" · ");
}
function traceIsActivity(t) {
  const kind = String(t.kind || "").toLowerCase();
  return kind.includes("task_") || kind.includes("tool_") || kind.includes("llm_call") ||
    kind.includes("progress") || kind.includes("agent_state") || kind.includes("error") ||
    kind.includes("shell_") || kind.includes("interaction") || kind.includes("file_");
}
function turnHTML(turn) {
  const status = turn.status || "streaming";
  const tools = Array.isArray(turn.tool_calls) && turn.tool_calls.length
    ? `<div class="activity-meta">tools: ${turn.tool_calls.map(esc).join(" → ")}</div>` : "";
  const error = turn.error ? `<div class="err">错误：${esc(turn.error)}</div>` : "";
  return `<div class="output-item">
    <div class="activity-meta">Loop ${turn.loop || 0} · ${esc(status)} · task ${esc(turn.task_id || "-")} · ${fmtTime(turn.completed_at || turn.started_at)}</div>
    <pre>${esc(turn.text || "（本轮没有公开文本）")}</pre>${tools}${error}
  </div>`;
}
function activityHTML(t) {
  return `<div class="activity-item"><div class="activity-meta">${fmtTime(t.at)}${t.agent_id ? " · " + esc(t.agent_id) : ""}</div><div>${esc(traceText(t))}</div></div>`;
}
function renderAgentWorkbench() {
  const ids = ensureActiveAgent();
  $("agentTabs").innerHTML = ids.length ? ids.map(id =>
    `<button class="btn agent-tab${id === state.activeAgent ? " active" : ""}" data-agent-tab="${esc(id)}">${esc(id)}</button>`
  ).join("") : '<div class="empty">暂无 Agent</div>';
  if (!state.activeAgent) {
    $("agentSummary").innerHTML = '<div class="empty">Agent 启动后可在这里查看独立输出</div>';
    $("agentOutput").innerHTML = '<div class="empty">暂无输出</div>';
    $("agentActivity").innerHTML = '<div class="empty">暂无动向</div>';
    return;
  }
  const agent = state.agents.find(a => a.id === state.activeAgent);
  $("agentSummary").innerHTML = agent ? `<div class="workbench-head">
    <span class="cid">${esc(agent.id)}</span><span class="badge st-${esc(agent.state)}">${esc(agent.state)}</span>

const KINDS = [
  ["TraceEvent", "Trace 事件"], ["LogLine", "日志"],
  ["OutputText", "代理输出"], ["OutputStream", "模型流"], ["OutputTurn", "完成轮次"], ["OutputResult", "任务结果"],
];
const enabled = { TraceEvent: true, LogLine: true, OutputText: true, OutputStream: true, OutputTurn: true, OutputResult: true };
$("filters").innerHTML = KINDS.map(([k, label]) =>
  `<label><input type="checkbox" data-k="${k}" checked> ${label}</label>`).join("");
$("filters").addEventListener("change", e => {
  enabled[e.target.dataset.k] = e.target.checked;

});
function fmtTime(iso) { try { return new Date(iso).toLocaleTimeString("zh-CN", { hour12: false }); } catch { return ""; } }
function renderDiagnostics() {
  const body = $("streamBody");
  const rows = [];
  if (enabled.TraceEvent) for (const t of state.feed.traces) rows.push({
    at: t.at, kind: "TraceEvent", cls: "", text: `${t.agent_id ? "[" + t.agent_id + "] " : ""}${traceText(t)}`,
  });
  if (enabled.LogLine) for (const item of state.feed.logs) rows.push({
    at: item.at, kind: "LogLine", cls: "log", text: item.text || "",
    hideTime: /^\d{4}\/\d{2}\/\d{2}/.test(item.text || ""),
  });
  for (const item of state.feed.outputs) {
    const kind = item.kind === "stream" ? "OutputStream" : (item.kind === "result" ? "OutputResult" : "OutputText");
    if (!enabled[kind]) continue;
    const suffix = item.error ? ` [stream error] ${item.error}` : (item.kind === "stream" ? (item.done ? " ✓" : " …") : "");
    rows.push({ at: item.at, kind, cls: "out", text: `[${item.agent_id || "-"}] ${item.text || ""}${suffix}` });
  }

    at: turn.completed_at || turn.started_at, kind: "OutputTurn", cls: "out",
    text: `[${turn.agent_id || "-"}] L${turn.loop || 0} ${turn.text || "（本轮没有公开文本）"}`,
  });
  rows.sort((a, b) => new Date(a.at || 0) - new Date(b.at || 0));

  body.innerHTML = visible.length ? visible.map(row =>
    `<div class="ev ${row.cls}"><span class="t">${row.hideTime ? "" : fmtTime(row.at)}</span><span class="k">${esc(row.kind)}</span>${esc(row.text)}</div>`
  ).join("") : '<div class="empty">当前过滤条件下没有诊断事件</div>';

function renderVisibleFeeds() {

function addFeedOutput(item) {
  if (!item) return;
  const normalized = Object.assign({ kind: "text", at: new Date().toISOString() }, item);
  if (normalized.kind === "stream" && normalized.stream_id) {
    const index = state.feed.outputs.findIndex(existing => existing.kind === "stream" && existing.stream_id === normalized.stream_id);
    if (index >= 0) state.feed.outputs[index] = normalized;
    else state.feed.outputs.push(normalized);
  } else {
    state.feed.outputs.push(normalized);
  }
  if (state.feed.outputs.length > 200) state.feed.outputs.splice(0, state.feed.outputs.length - 200);
  renderVisibleFeeds();
}
function addTurn(item) {
  if (!item || !item.stream_id) return;
  const normalized = {
    id: item.stream_id, session_id: item.session_id || "", agent_id: item.agent_id || "", task_id: item.task_id || "",
    loop: item.loop || 0, text: item.text || "", status: item.error ? "failed" : "completed",
    tool_calls: item.tool_calls || [], started_at: item.at || new Date().toISOString(),
    completed_at: item.at || new Date().toISOString(), error: item.error || "",
  };
  const index = state.turns.findIndex(turn => turn.id === normalized.id);
  if (index >= 0) state.turns[index] = normalized;
  else state.turns.push(normalized);
  renderVisibleFeeds();
}
function upsertStreamingTurn(item) {
  if (!item || !item.stream_id) return;
  const index = state.turns.findIndex(turn => turn.id === item.stream_id);
  if (index >= 0) {
    if (state.turns[index].status === "completed" || state.turns[index].status === "failed") return;
    state.turns[index] = Object.assign({}, state.turns[index], {
      text: item.text || state.turns[index].text || "",
      error: item.error || state.turns[index].error || "",
      status: "streaming",
    });
  } else {
    state.turns.push({
      id: item.stream_id, session_id: item.session_id || "", agent_id: item.agent_id || "", task_id: item.task_id || "",
      loop: item.loop || 0, text: item.text || "", status: "streaming",
      tool_calls: [], started_at: item.at || new Date().toISOString(), error: item.error || "",
    });
  }
}

function toast(msg, isErr) {
  const t = $("toast");
  t.textContent = msg;
  t.className = isErr ? "err" : "";
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => t.classList.add("hidden"), 6000);
}
$("toast").addEventListener("click", () => $("toast").classList.add("hidden"));

async function postJSON(url, body) {
  const resp = await fetch(url, {
    method: "POST",
    headers: Object.assign({ "Content-Type": "application/json" }, authHeaders()),
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  let data = null;
  try { data = await resp.json(); } catch { /* 空响应体 */ }
  if (!resp.ok) {
    if (resp.status === 401) askToken();
    const err = new Error((data && data.error) || ("HTTP " + resp.status));
    err.status = resp.status;
    throw err;
  }
  return data || {};
}

// 顶栏：用户输入（Enter / 发送按钮）。以 "/" 开头的输入走斜杠命令体系，
// 不投递给调度器；普通文本成功发送后清空输入框，失败弹错误提示。
async function sendInput() {
  const box = $("userInput");
  const text = box.value.trim();
  if (!text) return;
  if (text.startsWith("/")) {
    box.value = ""; hideSuggest();
    runCommand(text);
    return;
  }
  try {
    await postJSON("/api/input", { text });
    box.value = "";
  } catch (err) { toast(err.message, true); }
}
$("sendBtn").addEventListener("click", sendInput);

// ---------- 斜杠命令：补全下拉 + 执行 ----------
// 命令目录来自 GET /api/commands（与 TUI 共用 ui.CommandCatalog 数据源）；
// scope !== "shared" 的是 TUI 视图命令，WebUI 页面已直接展示对应信息。
let COMMANDS = [];
const sharedCmds = () => COMMANDS.filter(c => c.scope === "shared");
function usageOf(c) { return "/" + c.name + (c.args ? " " + c.args : ""); }

let sugItems = [], sugIndex = -1;
function matchCmds(input) {
  if (!input.startsWith("/")) return [];
  const sp = input.indexOf(" ");
  if (sp >= 0) { // 参数阶段：持续展示该命令的用法提示
    const name = input.slice(1, sp).toLowerCase();
    const exact = sharedCmds().find(c => c.name === name || (c.aliases || []).includes(name));
    return exact ? [exact] : [];
  }
  const p = input.slice(1).toLowerCase();
  return sharedCmds().filter(c => c.name.startsWith(p) || (c.aliases || []).some(a => a.startsWith(p)));
}
function hideSuggest() { $("suggest").classList.add("hidden"); sugItems = []; sugIndex = -1; }
function renderSuggest() {
  const box = $("userInput"), dd = $("suggest");
  sugItems = matchCmds(box.value);
  if (!sugItems.length) { hideSuggest(); return; }
  if (sugIndex < 0 || sugIndex >= sugItems.length) sugIndex = 0;
  dd.innerHTML = sugItems.map((c, i) =>
    `<div class="row${i === sugIndex ? " sel" : ""}" data-i="${i}"><span class="u">${esc(usageOf(c))}</span><span class="d">${esc(c.desc)}</span></div>`).join("");
  dd.classList.remove("hidden");
}
function completeTo(c, runIfNoArgs) {
  const box = $("userInput");
  box.value = "/" + c.name + (c.args ? " " : "");
  box.focus();
  if (!c.args && runIfNoArgs) { hideSuggest(); sendInput(); } else renderSuggest();
}
$("suggest").addEventListener("mousedown", e => { // mousedown 先于输入框 blur
  const row = e.target.closest(".row");
  if (!row) return;
  e.preventDefault();
  completeTo(sugItems[+row.dataset.i], true);
});
$("userInput").addEventListener("input", () => { sugIndex = -1; renderSuggest(); });
$("userInput").addEventListener("keydown", e => {
  const ddOpen = !$("suggest").classList.contains("hidden");
  if (e.key === "ArrowDown" && ddOpen) { sugIndex = (sugIndex + 1) % sugItems.length; renderSuggest(); e.preventDefault(); return; }
  if (e.key === "ArrowUp" && ddOpen) { sugIndex = (sugIndex - 1 + sugItems.length) % sugItems.length; renderSuggest(); e.preventDefault(); return; }
  if (e.key === "Tab" && ddOpen) { e.preventDefault(); completeTo(sugItems[sugIndex], false); return; }
  if (e.key === "Escape") { if (ddOpen) { hideSuggest(); e.preventDefault(); } return; }
  if (e.key === "Enter") { hideSuggest(); sendInput(); }
});
$("userInput").addEventListener("blur", () => setTimeout(hideSuggest, 120));

// resolveCmd：精确名 / 别名优先；否则唯一前缀命中（"/h" → /help）。
function resolveCmd(token) {
  const name = token.toLowerCase();
  const exact = COMMANDS.find(c => c.name === name || (c.aliases || []).includes(name));
  if (exact) return exact;
  const pref = COMMANDS.filter(c => c.name.startsWith(name) || (c.aliases || []).some(a => a.startsWith(name)));
  return pref.length === 1 ? pref[0] : null;
}

async function getJSON(url) {
  const resp = await fetch(url, { headers: authHeaders() });
  let data = null;
  try { data = await resp.json(); } catch { /* 空响应体 */ }
  if (!resp.ok) {
    if (resp.status === 401) askToken();
    const err = new Error((data && data.error) || ("HTTP " + resp.status));
    err.status = resp.status;
    throw err;
  }
  return data || {};
}

async function runCommand(line) {
  const parts = line.split(/\s+/);
  const cmd = resolveCmd(parts[0].slice(1));
  if (!cmd) { toast("未知命令：" + parts[0] + "（输入 /help 查看帮助）", true); return; }
  if (cmd.scope !== "shared") {
    toast(usageOf(cmd) + " 是 TUI 视图命令；WebUI 已在页面中直接展示对应信息", true);
    return;
  }
  const args = parts.slice(1);
  try {
    switch (cmd.name) {
      case "help": openModal("命令帮助", helpHTML()); break;
      case "status": openModal("系统状态", statusHTML()); break;
      case "cancel": {
        if (!args[0]) { toast("用法：/cancel <task-id>", true); return; }
        const d = await postJSON("/api/tasks/cancel", { id_prefix: args[0] });
        toast("已取消任务：" + (d.task_id || args[0]), false);
        break;
      }
      case "mode": {
        let axis, value;
        if (!args.length) {
          axis = "topo";
          value = curModes.topo === "solo" ? "team" : "solo";
        } else if (args.length === 2) {
          axis = args[0].toLowerCase();
          value = args[1].toLowerCase();
        } else {
          toast("用法：/mode [exec|topo <值>]", true);
          return;
        }
        const allowed = {
          exec: ["normal", "strict", "readonly", "yolo"],
          topo: ["team", "solo"],
        };
        if (!allowed[axis] || !allowed[axis].includes(value)) {
          toast("无效模式；exec=normal|strict|readonly|yolo，topo=team|solo", true);
          return;
        }
        await setMode(axis, value);
        toast(`已设置 ${axis}：${modeLabel(axis, value)}`, false);
        break;
      }
      case "steer": {
        if (!args[0] || !args[1]) { toast("用法：/steer <agent-id> <消息>", true); return; }
        await postJSON("/api/steer", { agent_id: args[0], message: args.slice(1).join(" ") });
        toast("已发送指导 → " + args[0], false);
        break;
      }
      case "doctor": {
        if (args[0] !== "agents") { toast("用法：/doctor agents — 审计代理身份与实际权限的一致性（只读）", true); return; }
        const d = await postJSON("/api/doctor/agents", {});
        toast("代理审计任务已创建：" + (d.task_id || "-") + "，报告将作为任务结果回显", false);
        break;
      }
      case "new": {
        const d = await postJSON("/api/session/new");
        if (d.session_id) $("session").textContent = d.session_id;
        toast("已创建新会话：" + (d.session_id || "-"), false);
        break;
      }
      case "session": {
        const d = await getJSON("/api/sessions");
        const list = d.sessions || [];
        if (!args[0]) { openModal("Sessions（编号切换：/session <编号>）", sessionsHTML(list)); break; }
        const n = parseInt(args[0], 10);
        if (!n || n < 1 || n > list.length) { toast("无效编号：" + args[0] + "（1-" + list.length + "）", true); return; }
        await switchSession(list[n - 1].id);
        break;
      }
    }
  } catch (err) { toast(err.message, true); }
}

    toast("已经是当前会话：" + id, false);

      : "请为选项“" + button.textContent.trim() + "”补充说明：";
    const input = prompt(message);
    if (input === null) return;
    if (!input.trim()) { toast("回答文本不能为空", true); return; }
    text = input;
  }
  button.disabled = true;
  try {
    await postJSON("/api/interactions/" + encodeURIComponent(id) + "/response", {
      expected_version: version,
      option_id: optionID,
      text,
    });
    state.interactions = state.interactions.filter(item => item.id !== id);
    renderInteractions();
    toast("回应已提交", false);
  } catch (err) {
    button.disabled = false;
    if (err.status === 409 || err.status === 410) {
      try { applySnapshot(await getJSON("/api/snapshot")); } catch { /* SSE 会继续自愈 */ }
    }
    toast(err.message, true);
  }
});

// ---------- 数据流：快照 + SSE ----------
function applySnapshot(snap) {
  if (!snap) return;
  state.agentOutputFollow = true;
  renderHeader(snap);
  state.agents = snap.agents || [];
  state.tasks = snap.tasks || [];
  state.interactions = snap.pending_interactions || [];
  state.result = snap.last_result || null;
  state.turns = Array.isArray(snap.turns) ? snap.turns : [];
  const feed = snap.feed || {};
  state.feed = {
    outputs: Array.isArray(feed.outputs) ? feed.outputs : [],
    logs: Array.isArray(feed.logs) ? feed.logs : [],
    traces: Array.isArray(feed.traces) ? feed.traces : [],
  };
  renderAll();
}
function applyUpdate(u) {
  switch (u.kind) {
    case "SnapshotSync": applySnapshot(u.snapshot); break;
    case "AgentsChanged":
      state.agents = u.agents || []; state.tasks = u.tasks || [];
      renderAgents(); renderTasks(); renderVisibleFeeds(); break;
    case "InteractionsChanged":
      state.interactions = u.interactions || [];
      renderInteractions(); break;
    case "TurnsChanged":
      state.turns = Array.isArray(u.turns) ? u.turns : [];
      state.agentOutputFollow = true;
      renderVisibleFeeds(); break;
    case "TraceEvent": {
      const t = u.trace;
      if (t && !t.at) t.at = u.at || new Date().toISOString();
      addFeedTrace(t);
      break;
    }
    case "LogLine": addFeedLog(u.log_line, u.at); break;
    case "OutputText": addFeedOutput(Object.assign({}, u.output, { kind: "text", at: u.at })); break;
    case "OutputStream": {
      const item = Object.assign({}, u.output, { kind: "stream", at: u.at });
      upsertStreamingTurn(item); addFeedOutput(item); break;
    }
    case "OutputTurn": addTurn(Object.assign({}, u.output, { at: u.at })); break;
    case "OutputResult":
      state.result = u.output || null;
      renderResult();
      toast("任务已完成，完整回复已显示在“最近完成回复”区域", false);
      addFeedOutput(Object.assign({}, u.output, { kind: "result", at: u.at }));
      break;
  }
}

let es = null, backoff = 1000;
function setConn(on, label) {
  const c = $("conn");
  c.className = on ? "on" : "off";
  c.textContent = label || (on ? "已连接" : "未连接");
}
function connectSSE() {
  if (es) es.close();
  es = new EventSource(withToken("/api/events"));
  es.onopen = () => { backoff = 1000; setConn(true); };
  es.onmessage = e => { try { applyUpdate(JSON.parse(e.data)); } catch (err) { console.warn("bad frame", err); } };
  es.onerror = () => {
    setConn(false, "连接断开，" + Math.round(backoff / 1000) + "s 后重连…");
    es.close(); es = null;
    setTimeout(connectSSE, backoff);
    backoff = Math.min(backoff * 2, 15000);
  };
}

async function boot() {
  try {
    const [snapResp, cmdResp] = await Promise.all([
      fetch("/api/snapshot", { headers: authHeaders() }),
      fetch("/api/commands", { headers: authHeaders() }),
    ]);
    if (snapResp.status === 401 || cmdResp.status === 401) { askToken(); location.reload(); return; }
    if (!snapResp.ok) throw new Error("HTTP " + snapResp.status);
    if (cmdResp.ok) COMMANDS = await cmdResp.json(); // 失败时命令体系退化为"未知命令"提示
    applySnapshot(await snapResp.json());
    connectSSE();
  } catch (err) {
    setConn(false, "加载失败：" + err.message);
    setTimeout(boot, 3000);
  }
}
boot();
</script>
