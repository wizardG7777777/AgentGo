# Program-change verification reactors for config.program-upgrade-small.yaml.
#
# Planned DAGs already wake on every Task terminal fact. This sample therefore
# demonstrates a project-specific, non-terminal trigger: repeated Worker retry
# pressure asks Scheduler to inspect the graph early, without creating a Task.

reactors:
  - name: review_worker_retry_pressure
    on: task_retry
    kind: worker
    when: "${event.task.retry_count} >= 2"
    request_replan:
      reason_code: worker_retry_pressure
      urgency: high
      detail: "A Worker has retried repeatedly; inspect the current facts and decide whether the DAG needs a replacement or narrower task."
