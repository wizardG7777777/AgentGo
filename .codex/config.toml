# AgentGo does not use Vercel services. Keep its plugin-provided hooks and skills
# out of this repository while preserving the plugin for other projects.
[plugins."vercel-plugin@plugins-cli"]
enabled = false

# The Vercel MCP server is registered globally, but is not relevant to AgentGo.
# `url` must be repeated here (matching the global definition) so Codex can still
# determine the transport type for this override table — a bare `enabled = false`
# fails config validation with "invalid transport".
[mcp_servers.vercel]
url = "https://mcp.vercel.com"
enabled = false
