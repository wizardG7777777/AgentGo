# AgentGo v5 配置文件示例
# 将此文件复制为 config.yaml（或任意路径，通过 -config 指定）并按需修改。
#
# v5 沿用 v4 的嵌套 schema，并新增 agent_templates: 按需团队配置。
# 只有有效 llm: 也能 Scheduler-only 启动；tool_profiles: / agents: 是可选的预热配置，
# reactors_file: 仍可指向用户 reactor YAML（见文末与 docs/yaml-config-guide.md）。
# v3 顶层旧字段（worker_count / llm_base_url / agent_max_loops 等）会被解析层静默忽略，
# 不报错也不生效。撰写规范详见 docs/yaml-config-guide.md。

# ============================================================
# LLM 默认基础设施（per-kind 可通过 agents[*].model 覆盖）
# ============================================================
llm:
  base_url: https://api.openai.com/v1
  api_key: ${OPENAI_API_KEY}       # 支持 ${ENV_VAR} 环境变量替换（os.ExpandEnv）
  default_model: gpt-4o
  timeout_sec: 120
  # provider: openai                # 可选：openai / deepseek-v4 / deepseek-r1

# ============================================================
# 工具集白名单（命名复用层）
#
# 每个 agent kind 二选一：profile 引用本表 / tools 直接列工具名（不能同时给）。
# 工具名必须在 internal/tools 中已注册，否则启动报错。
# ============================================================
tool_profiles:
  worker_standard:
    - read_file
    - list_dir
    - grep_search
    - glob_search
    - write_file
    - edit_file
    - run_shell
    - web_search
    - web_fetch
    - send_message
    - request_replan              # 需要新增节点或遇到阻塞时请求 Scheduler 决策；普通 Agent 不直接改图

  explorer_full:
    - read_file
    - list_dir
    - grep_search
    - glob_search
    - web_search
    - web_fetch
    - send_message
    - request_replan

  acceptance_verifier:
    - read_file
    - list_dir
    - grep_search
    - glob_search
    - run_shell
    - web_search
    - web_fetch
    - submit_acceptance_result     # 仅绑定 AcceptanceRun 的 Task 能提交正式结果
    - request_replan               # 验收失败时请求 Scheduler 决定是否返工

# ============================================================
# Scheduler 配置（独立块，仅允许 model 字段外部覆盖）
# 工具集 / system prompt / replicas 等均硬编码在 internal/scheduler。
# ============================================================
scheduler:
  model: gpt-4o                    # 可选，缺省回落 llm.default_model

# ============================================================
# AgentTemplate（可选）
#
# 不配置目录也始终提供：
#   builtin/generalist@1 / builtin/explorer@1 / builtin/verifier@1
# user_dirs 中模板获得 user/ namespace，project_dirs 获得 project/ namespace。
# 项目模板推荐放在可 git 评审的 agent-templates/，不要放进通常被忽略的 .agentgo/。
# 每个 YAML 文件只定义一个模板；schema 见 docs/activate/AgentTemplate.md。
# ============================================================
# agent_templates:
#   user_dirs:
#     - /Users/me/.config/agentgo/templates
#   project_dirs:
#     - agent-templates
#   max_runtime_agents: 8

# ============================================================
# 预热 Agent kind 列表（可选：kind × replicas，同 kind 内完全同质）
#
# 整段 agents: 都可以省略。此时启动快照中真实 worker 数量为 0，Scheduler
# 会先用 list_agent_templates / provision_agent_team 创建真实 route，再发布下一轮 Task。
# 保留本段则在启动时创建常驻 Agent，适合已知的高频角色或降低首任务延迟。
# ============================================================
agents:
  - kind: worker
    replicas: 1
    event_type: ""                 # 默认任务队列（空字符串）
    profile: worker_standard       # 引用 tool_profiles 中的白名单
    # 或直接用 tools: [read_file, write_file, ...]  二选一
    model: gpt-4o                  # 覆盖 llm.default_model
    system_prompt_file: prompts/worker.md
    agent_max_loops: 10
    task_max_retries: 3
    enforce_compact_token_threshold: 4000
    context_limit: 16000
    # description 给 scheduler 看的一句话角色说明，影响任务派发选择
    description: |
      通用工作代理。能读写文件、跑 shell、检索网络；
      适合落盘类执行任务，不擅长纯调研。

  - kind: explorer
    replicas: 1
    event_type: explore
    profile: explorer_full
    model: gpt-4o-mini             # 调查类可用更便宜模型
    system_prompt_file: prompts/explorer.md
    agent_max_loops: 5
    task_max_retries: 3
    enforce_compact_token_threshold: 3000
    context_limit: 8000
    description: |
      广度优先调研代理。不写文件，仅返回 Markdown 文字回复。

  - kind: verifier
    replicas: 1
    event_type: acceptance.verify
    profile: acceptance_verifier
    model: gpt-4o-mini
    system_prompt_file: prompts/program_verifier.md
    agent_max_loops: 8
    task_max_retries: 2
    enforce_compact_token_threshold: 3000
    context_limit: 12000
    description: |
      正式验收代理。执行只读检查、测试与构建，并通过
      submit_acceptance_result 提交结构化 Criterion 和 Evidence 结果。

# ============================================================
# 运行时基础设施
# ============================================================
project_root: "."

infra:
  watchdog:
    interval_sec: 30
  mail_notifier:
    enabled: true
    interval_sec: 5
  store:
    event_channel_buffer: 64
    fifo_limit: 100
    default_concurrency: 2
    default_timeout_sec: 300       # 任务级超时（watchdog 据此判定 unclaimed）
  roster:
    wait_timeout_sec: 30

# ============================================================
# 启动期可观测性
# ============================================================
startup_probe: "tcp"               # "tcp"=DialTimeout 探测; "off"=跳过
startup_probe_timeout_sec: 5
startup_probe_failure_action: "warn"  # "warn"=仅警告继续; "exit"=失败硬退出

# ============================================================
# 杂项 / 行为开关
# ============================================================
max_subtask_depth: 3
shell_timeout_sec: 60
shell_blacklist: []
shell_greylist: []
search_api_provider: duckduckgo_html
search_api_url: ""
search_api_key: ""

# Hashline 行哈希增强（默认 true）
# hashline_enabled: true

# TransferNote 单条最大 token 预算（默认 3000 ≈ 6000 中文字符）
transfer_note_max_tokens: 3000

# 进度通知：完成文件写入 / 子任务发布等时发轻量 mailbox 消息（默认 true）
progress_notify_enabled: true

# agent runner 连续 N 次空闲轮询后退出 goroutine 的阈值
# 默认 0 = 永不空闲退出（生产推荐）
agent_idle_threshold: 0

# ============================================================
# Session 持久化
# ============================================================
session_retention_days: 30        # 已关闭 session 超过此天数则归档
session_archive_max: 50           # 归档上限，超过删除最旧

# ============================================================
# v5 用户 Reactor 配置（可选）
#
# 留空 → 系统仅运行内置 reactor；
# 指向一个 YAML 文件 → 由 internal/reactor/userdef.LoadFromFile 解析。
# Reactor YAML 的撰写规范见 docs/yaml-config-guide.md §3，
# legacy/unplanned Reactor 可参考本地旧 test_invest_reactors.yaml；不要把它当作动态 DAG 拓扑模板。
# 动态 DAG 的 Reactor 示例见 reactors.program-verify.yaml：Task 终态已有内置唤醒，
# 示例用非终态的重试压力提交 request_replan，由 Scheduler 决定是否调整图。
# 本示例预热了 acceptance.verify；省略它时 Scheduler 可按需 provision builtin/verifier@1。
# 自定义正式验收 Agent 或模板仍必须显式加入 submit_acceptance_result。
# ============================================================
# reactors_file: reactors.yaml

