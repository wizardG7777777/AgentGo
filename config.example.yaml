# AgentGo v5 配置文件示例
# 将此文件复制为 config.yaml（或任意路径，通过 -config 指定）并按需修改。
#
# v5 沿用 v4 的嵌套 schema，并新增 agent_templates: 按需团队配置。
# 只有有效 llm: 也能 Scheduler-only 启动；tool_profiles: / agents: 是可选的预热配置，
# reactors_file: 仍可指向用户 reactor YAML（见文末与 docs/yaml-config-guide.md）。
# v3 顶层旧字段（worker_count / llm_base_url / agent_max_loops 等）会被解析层静默忽略，
# 不报错也不生效。撰写规范详见 docs/yaml-config-guide.md。

# ============================================================
# LLM 默认基础设施（per-kind 可通过 agents[*].model 覆盖）
# ============================================================
llm:
  base_url: https://api.openai.com/v1
  api_key: ${OPENAI_API_KEY}       # 支持 ${ENV_VAR} 环境变量替换（os.ExpandEnv）
  default_model: gpt-4o
  timeout_sec: 120
  # reasoning_effort: medium        # 仅为支持该参数的模型启用；可选值见 docs/yaml-config-guide.md
  stream: true                      # Chat Completions SSE；Agent/UI 原位显示完整累积快照

# ============================================================
# 工具集白名单（命名复用层）
#
# 每个 agent kind 二选一：profile 引用本表 / tools 直接列工具名（不能同时给）。
# 工具名必须在 internal/tools 中已注册，否则启动报错。
# ============================================================
tool_profiles:
  worker_standard:
    - read_file
    - list_dir
    - grep_search
    - glob_search
    - read_content_ref
    - write_file
    - edit_file
    - run_shell
    - web_search
    - web_fetch
    - send_message
    - request_user_input          # 结构化询问用户；只返回回答，不授予 Shell 权限或替代 Plan 控制
    - publish_task                # 仅 plan_id 为空的兼容任务可发布一层子任务（受 MaxSubtaskDepth 约束）；计划内改图走 request_replan
    - request_replan              # 需要新增节点或遇到阻塞时请求 Scheduler 决策；普通 Agent 不直接改图
    - submit_task_result          # 结构化提交最终结果（summary/检查/证据/风险）；带 expected_artifacts 校验

  explorer_full:
    - read_file
    - list_dir
    - grep_search
    - glob_search
    - read_content_ref
    - web_search
    - web_fetch
    - send_message
    - request_user_input          # 调研需要用户澄清时提出 2-8 项结构化选择
    - request_replan

  acceptance_verifier:
    - read_file
    - list_dir
    - grep_search
    - glob_search
    - read_content_ref
    - web_search
    - web_fetch
    - submit_task_result             # acceptance runner 经 verdict=pass|fixable|failed 提交结论

# ============================================================
# Scheduler 配置（独立块）
# 工具集 / system prompt / replicas 仍硬编码在 internal/scheduler；以下行为预算可覆盖。
# ============================================================
scheduler:
  model: gpt-4o                              # 可选，缺省回落 llm.default_model

# ============================================================
# 两轴工作模式（可选；两轴正交可组合，字段为空 = 该轴取默认）
#   exec: 执行权限轴 —— normal（默认）/ strict / readonly / yolo
#   topo: 编排拓扑轴 —— team（默认）/ solo
# gate 轴已于 V6 移除（执行前审阅改由 Graph approval 节点承担）；
# 显式设置 modes.gate 会在启动校验报迁移诊断。
# 运行期可用 TUI / Web 的 /mode 切换两轴。
# ============================================================
# modes:
#   exec: normal
#   topo: team

# ============================================================
# AgentTemplate（可选；2026-08-20 起整套机制默认搁置）
#
# enabled 缺省 false：Scheduler 不注册 list_agent_templates /
# provision_agent_team，图节点只路由下方 agents: 声明的静态 kind。
# 模板机制在静态 Agent 流程验证稳定前有意搁置；显式 enabled: true
# 可重新开放工具注册（提示词组队教程尚未恢复，仅供机制实验）。
#
# 开启后不配置目录也始终提供：
#   builtin/generalist@1 / builtin/explorer@1 / builtin/verifier@1
# user_dirs 中模板获得 user/ namespace，project_dirs 获得 project/ namespace。
# 项目模板推荐放在可 git 评审的 agent-templates/，不要放进通常被忽略的 .agentgo/。
# 每个 YAML 文件只定义一个模板；schema 见 docs/activate/AgentTemplate.md。
# ============================================================
# agent_templates:
#   enabled: false
#   user_dirs:
#     - /Users/me/.config/agentgo/templates
#   project_dirs:
#     - agent-templates
#   max_runtime_agents: 8

# ============================================================
# 预热 Agent kind 列表（可选：kind × replicas，同 kind 内完全同质）
#
# 整段 agents: 都可以省略，但模板机制搁置期间这意味着没有任何可认领
# 任务的 route，Scheduler 将无人可用——图节点只能路由这里声明的静态
# kind，请按角色需要保留本段（降低首任务延迟之外的另一层必要性）。
# ============================================================
agents:
  - kind: worker
    replicas: 1
    event_type: ""                 # 默认任务队列（空字符串）
    profile: worker_standard       # 引用 tool_profiles 中的白名单
    # 或直接用 tools: [read_file, write_file, ...]  二选一
    model: gpt-4o                  # 覆盖 llm.default_model
    system_prompt_file: prompts/worker.md
    task_max_retries: 3
    # description 给 scheduler 看的一句话角色说明，影响任务派发选择
    description: |
      通用工作代理。能读写文件、跑 shell、检索网络；
      适合落盘类执行任务，不擅长纯调研。

  - kind: explorer
    replicas: 1
    event_type: explore
    profile: explorer_full
    model: gpt-4o-mini             # 调查类可用更便宜模型
    system_prompt_file: prompts/explorer.md
    task_max_retries: 3
    description: |
      广度优先调研代理。不写文件，仅返回 Markdown 文字回复。

  - kind: verifier
    replicas: 1
    event_type: acceptance.verify
    profile: acceptance_verifier
    model: gpt-4o-mini
    system_prompt_file: prompts/program_verifier.md
    task_max_retries: 2
    description: |
      正式验收代理（Graph acceptance 节点 runner）。读取交付物、消费上游
      Result/Evidence，并通过 submit_task_result.verdict 提交 pass/fixable/failed；
      completed 结果省略 event，证据不足时提交 status=blocked；
      需要 CLI/Shell 的检查由普通 checker agent 执行后经图数据流传入。

# ============================================================
# 运行时基础设施
# ============================================================
project_root: "."

infra:
  watchdog:
    interval_sec: 30
    progress_heartbeat_grace_sec: 120  # 新 Loop checkpoint 超过此窗口未更新时，仅发布 typed liveness observation
    pending_alert_grace_sec: 300  # 有合法 route 但长期未领取：只告警，不终止任务
    unroutable_grace_sec: 300     # 无兼容 route 持续超过该时间：标记 blocked
  mail_notifier:
    enabled: true
    interval_sec: 5
  store:
    event_channel_buffer: 64
    fifo_limit: 100
    default_concurrency: 1       # 任务级认领上限的兜底值（仅影响未显式指定的非 plan 发布路径）；>1 会让多个 Agent 重复执行同一任务
    default_timeout_sec: 3600      # legacy 键：只填充 Task.ExpectedDuration（SLO/UI），不形成 deadline；新 Loop 由 RunContract 控制
  roster:
    wait_timeout_sec: 30

# ============================================================
# UI 前端（UI Hub）
#
# frontends 声明启用哪些前端：tui（终端 UI，默认唯一启用）/ web（Web
# Dashboard，内嵌单页应用，HTTP + SSE，含任务/审批等控制面）。两者可同时启用。
# web.listen 默认 127.0.0.1:8399；绑定非 loopback 地址（0.0.0.0 / :: /
# 公网 IP）时必须设置 web.token，否则启动校验拒绝——本系统具备 shell
# 执行能力，其管理面无鉴权暴露到局域网/公网等同于开放命令执行入口。
# web.token 为空 = 不启用鉴权（仅限 loopback 监听）。
# web.auto_open 缺省 false：Dashboard 启动成功后不自动打开系统浏览器；
# 需要时显式设置 true（token 非空时地址自带 ?token=）。
# ============================================================
# ui:
#   frontends: [tui, web]
#   web:
#     listen: "127.0.0.1:8399"
#     token: ""
#     auto_open: false

# ============================================================
# 启动期可观测性
# ============================================================
startup_probe: "tool"              # "tool"=TCP+真实 function call; "tcp"=仅连通; "off"=跳过
startup_probe_timeout_sec: 5
startup_probe_failure_action: "warn"  # "warn"=仅警告继续; "exit"=失败硬退出

# ============================================================
# 杂项 / 行为开关
# ============================================================
max_subtask_depth: 3
shell_timeout_sec: 60
shell_blacklist: []
shell_greylist: []
# 默认 false：项目内 .agentgo/project_rules.yaml 只能追加 Shell 规则，不能删除
# 系统默认或主配置追加的黑/灰名单。仅受信任主配置明确承担风险时才设 true。
allow_project_shell_rule_removals: false
search_api_provider: duckduckgo_html
search_api_url: ""
search_api_key: ""

# Hashline 行哈希增强（默认 true）
# hashline_enabled: true

# TransferNote 单条最大 token 预算（默认 3000 ≈ 6000 中文字符）
transfer_note_max_tokens: 3000

# 进度通知：完成文件写入 / 子任务发布等时发轻量 mailbox 消息（默认 true）
progress_notify_enabled: true

# agent runner 连续 N 次空闲轮询后退出 goroutine 的阈值
# 默认 0 = 永不空闲退出（生产推荐）
agent_idle_threshold: 0

# ============================================================
# Session 持久化
# ============================================================
session_retention_days: 30        # 已关闭 session 超过此天数则归档
session_archive_max: 50           # 归档上限，超过删除最旧
session_resume_max_idle_sec: 3600 # 已废弃（启动永远新会话、不再自动恢复）；保留仅为配置兼容，设置无效
session_snapshot_interval_sec: 30 # 运行期完整快照间隔，限制崩溃后的副作用重放窗口；0=禁用周期保存

# ============================================================
# v5 用户 Reactor 配置（可选）
#
# 留空 → 系统仅运行内置 reactor；
# 指向一个 YAML 文件 → 由 internal/reactor/userdef.LoadFromFile 解析。
# Reactor YAML 的撰写规范见 docs/yaml-config-guide.md §3，
# legacy/unplanned Reactor 可参考本地旧 test_invest_reactors.yaml；不要把它当作动态 DAG 拓扑模板。
# 动态 DAG 的 Reactor 示例见 reactors.program-verify.yaml：Task 终态已有内置唤醒，
# 示例用非终态的重试压力提交 request_replan，由 Scheduler 决定是否调整图。
# 本示例预热了 acceptance.verify；省略它时 Scheduler 可按需 provision builtin/verifier@1。
# 自定义验收 Agent 或模板必须显式加入 submit_task_result（经 verdict 提交结论）。
# ============================================================
# reactors_file: reactors.yaml

