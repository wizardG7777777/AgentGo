graph:
  request_contract: agentgo.graph/v7

# AgentGo SWE 评测专用配置（v4 schema）
#
# 用途：以 Flask 真实仓库为对象的中等项目行为评测（SWE 式红→绿任务）。
# 这是一个**模板**：__AGENTGO_ROOT__/__PROJECT_ROOT__/__PORT__/__TOKEN__/
# __BASE_URL__/__FAST_MODEL__/__FLAG_SHIP_MODEL__/__PROTOCOL__/__KEY_VAR__ 九个占位符由仓库内
# `scripts/swe_test_runner/runner.py`
# 在每次运行时渲染；正式题目清单与 prompt 位于仓库 suite，外部 `SWE_TESTBED`
# 只保存 Flask 源仓库、隔离 worktree 和运行产物。
#
# 换模型供应商需显式设置下列三个环境变量；协议默认使用 responses，完整 SWE Test Runner
# 启动环境契约见
# `scripts/swe_test_runner/README.md`：
#   SWE_BASE_URL   供应商的 OpenAI 兼容端点
#   SWE_FAST_MODEL      快速模型能力档位
#   SWE_FLAG_SHIP_MODEL 旗舰模型能力档位
#   SWE_API_KEY    注入密钥的环境变量（固定读取该变量名）
# 可选 SWE_PROTOCOL 覆盖为 chat_completions 时才进入显式兼容链。
# 本文件不落任何明文密钥。
#
# 评测纪律：
# - 环境变量只注入能力档位，具体角色分配由本 YAML 的 model 字段决定；两个变量
#   填相同值可复现全同模型基线，填不同值可评估分层协作。
# - 全程禁止联网搜索：所有 profile 均不含 web_search/web_fetch；
#   跑后审计 trace 确认零 web 调用。
# - agent_templates 动态组队机制默认关闭（2026-08-20 起搁置）：图节点只
#   路由本文件声明的静态 kind——agent 节点缺省走 worker（event_type ""
#   默认队列），调查路由 explore，验收路由 acceptance.verify。
llm:
  request_contract: agentgo.model-request/v1
  base_url: "__BASE_URL__"
  api_key: ${__KEY_VAR__}
  default_model: "__FAST_MODEL__"
  protocol: "__PROTOCOL__"
  timeout_sec: 300
  default_context_window_tokens: 880000
  default_max_completion_tokens: 65536
  reasoning_effort: low

tool_profiles:
  swe_explorer:                       # 调查：通过 Shell 搜索，通过检视获取节点事实
    - run_shell
    - read_file



    - read_evidence
    - inspect_board
    - inspect_node
    - send_message
    - request_replan
    - submit_task_result
  swe_worker:                         # 执行：文件读写 + Shell；未配置独立 Web 工具
    - read_file



    - read_evidence
    - inspect_board
    - inspect_node
    - apply_change

    - run_shell

    - send_message
    - request_replan
    - submit_task_result
  swe_verifier:                       # 验收：只读 + 提交判定（无 Shell/独立 Web 工具）
    - read_file



    - read_evidence
    - inspect_board
    - inspect_node
    - submit_task_result

agents:
  - kind: explorer
    replicas: 2
    event_type: "explore"
    profile: swe_explorer
    system_prompt_file: "__AGENTGO_ROOT__/prompts/swe/explorer.md"
    # Explorer 的根因/所有权边界判断属于业务推理，真实 Flask 日志证明快速模型会把
    # 使用已通过显式 v7-v11 matrix 的快速档。
    model: "__FLAG_SHIP_MODEL__"

    task_max_retries: 5
    description: 调查代理：定位缺陷、读取项目与运行事实，使用 Shell 完成命令行调查。
  - kind: worker
    replicas: 2
    event_type: ""
    profile: swe_worker
    system_prompt_file: "__AGENTGO_ROOT__/prompts/swe/worker.md"
    model: "__FLAG_SHIP_MODEL__"
    # probe proves this business model rejects v8 while fast passes both fixtures.
    task_max_retries: 5
    description: 通用执行代理：调查、修改代码、运行 pytest 验证；未配置独立 Web 工具；Shell 网络能力由执行环境决定。
  - kind: verifier
    replicas: 1
    event_type: "acceptance.verify"
    profile: swe_verifier
    system_prompt_file: "__AGENTGO_ROOT__/prompts/swe/verifier.md"
    model: "__FAST_MODEL__"
    task_max_retries: 5
    description: 验收代理：按节点验收标准核验上游证据与仓库状态；无 Shell/独立 Web 工具。

scheduler:
  model: "__FAST_MODEL__"

project_root: "__PROJECT_ROOT__"
startup_probe: "tool"
startup_probe_timeout_sec: 45
startup_probe_failure_action: "exit"
shell_timeout_sec: 300

ui:
  frontends: [web]
  web:
    listen: "127.0.0.1:__PORT__"
    token: "__TOKEN__"
    auto_open: false
