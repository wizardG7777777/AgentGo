name: 验证

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: go test ./... -timeout 180s
      - run: go vet ./...
      - run: go build -o agentgo.exe
      - run: python -m unittest discover -s scripts/swe_test_runner -p '*_test.py'
      - run: python scripts/local_fake_provider_smoke.py --binary ./agentgo.exe
      - run: python scripts/local_fake_provider_smoke.py --binary ./agentgo.exe --protocol chat_completions
      - run: python scripts/local_fake_provider_smoke.py --binary ./agentgo.exe --team
      - if: runner.os == 'Linux'
        run: go test -race ./internal/llm ./internal/contextruntime ./internal/ui ./internal/session -timeout 180s
